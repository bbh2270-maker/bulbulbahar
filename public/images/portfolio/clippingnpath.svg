<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(250, 48)" text-anchor="middle">
    <!-- Geometric Pastel Polygon Mark -->
    <g transform="translate(0, 0)">
      <!-- Top yellow triangle -->
      <polygon points="0,-32 18,-4 -2,-6" fill="#FBBF24"/>
      <!-- Right pastel orange triangle -->
      <polygon points="18,-4 28,18 2,12" fill="#F87171"/>
      <!-- Left cyan triangle -->
      <polygon points="-2,-6 2,12 -18,16" fill="#38BDF8"/>
      <!-- Small magenta accent triangle -->
      <polygon points="-18,16 6,24 -4,32" fill="#EC4899"/>
    </g>

    <!-- Typography -->
    <text x="0" y="80" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#18181B" letter-spacing="-0.5">
      Clippingnpath
    </text>
    <text x="0" y="104" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#71717A" letter-spacing="3">
      PROFESSIONAL IMAGE EDITING STUDIO
    </text>
