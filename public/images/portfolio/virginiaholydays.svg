<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(0, 10)">
    <!-- Centered Airplane Diamond Mark -->
    <g transform="translate(250, 65)">
      <!-- Lime green rotated diamond/rhombus -->
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="#84CC16" transform="rotate(45)"/>
      
      <!-- Modern jet airplane silhouette in blue -->
      <path d="M-5,-24 L5,-24 L7,-6 L26,8 L24,14 L7,8 L6,22 L14,27 L13,31 L0,28 L-13,31 L-14,27 L-6,22 L-7,8 L-24,14 L-26,8 L-7,-6 Z" fill="#0284C7" transform="rotate(25)"/>
    </g>

    <!-- Typography -->
    <text x="250" y="142" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">
      Virginia Holydays
    </text>
    <text x="250" y="164" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#65A30D" text-anchor="middle" letter-spacing="3.5">
