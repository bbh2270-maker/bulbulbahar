<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(35, 30)">
    <!-- Gear & Tech Emblem -->
    <g transform="translate(15, 15)">
      <!-- Gear Cog Shape -->
      <circle cx="50" cy="50" r="42" fill="#EA580C"/>
      <circle cx="50" cy="50" r="22" fill="#ffffff"/>
      <!-- Inner Phone Silhouette -->
      <rect x="42" y="36" width="16" height="28" rx="3" fill="#0F172A"/>
      <circle cx="50" cy="60" r="1.5" fill="#ffffff"/>
      <rect x="46" y="38" width="8" height="1" rx="0.5" fill="#ffffff"/>
    </g>

    <!-- Typography -->
    <g transform="translate(140, 25)">
      <text x="0" y="44" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
        Gadget <tspan fill="#EA580C">&amp;</tspan> Gear
      </text>
      <text x="2" y="74" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#EA580C" letter-spacing="1">
        PREMIUM TECH &amp; SMARTPHONE RETAIL
      </text>
      <text x="2" y="96" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">
        FLAGSHIP ELECTRONICS LEADER
      </text>
    </g>
  </g>
</svg>
