<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(35, 30)">
    <!-- Medical Cross Shield Mark -->
    <g transform="translate(15, 15)">
      <!-- Shield Base -->
      <path d="M15,20 C15,20 50,10 50,10 C50,10 85,20 85,20 C85,60 50,92 50,92 C50,92 15,60 15,20 Z" fill="url(#blueGrad)" />
      <!-- White Medical Cross in Center -->
      <path d="M43,30 L57,30 L57,43 L70,43 L70,57 L57,57 L57,70 L43,70 L43,57 L30,57 L30,43 L43,43 Z" fill="#ffffff"/>
    </g>

    <defs>
      <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0082FB"/>
        <stop offset="100%" stop-color="#0055D4"/>
      </linearGradient>
    </defs>

    <!-- Typography -->
    <g transform="translate(140, 25)">
      <text x="0" y="44" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" fill="#0A2540" letter-spacing="-0.5">
        MyUS <tspan fill="#0082FB">Drugstore</tspan>
      </text>
      <text x="2" y="74" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#00C9A7" letter-spacing="1">
        PHARMACY &amp; HEALTHCARE RETAIL
      </text>
      <text x="2" y="96" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">
        OVER 5,000+ PRODUCTS DELIVERED
      </text>
    </g>
  </g>
</svg>
