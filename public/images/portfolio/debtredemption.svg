<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(250, 40)" text-anchor="middle">
    <!-- Emblem: Golden cross with soaring dove -->
    <g transform="translate(0, 10)">
      <!-- Golden Cross -->
      <path d="M-4,-28 L4,-28 L4,-12 L20,-12 L20,-4 L4,-4 L4,26 L-4,26 L-4,-4 L-20,-4 L-20,-12 L-4,-12 Z" fill="#D97706" opacity="0.95"/>
      <!-- Soaring Dove Silhouette -->
      <path d="M-8,-18 C-3,-26 8,-28 16,-22 C24,-16 26,-4 18,2 C10,-4 2,-8 -8,-18 Z" fill="#F59E0B"/>
      <path d="M6,-14 C12,-18 20,-16 26,-8 C20,-6 14,-8 6,-14 Z" fill="#FBBF24"/>
    </g>

    <!-- Main Title -->
    <text x="0" y="82" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#0A2540" letter-spacing="1">
      DEBT REDEMPTION
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="'Montserrat', 'Georgia', serif" font-size="20" font-weight="700" fill="#D97706" letter-spacing="0.5">
      Texas Debt Relief
    </text>
  </g>
</svg>
