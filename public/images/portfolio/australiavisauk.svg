<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(35, 30)">
    <!-- UK & Australia Sovereign Travel Advisory Mark -->
    <g transform="translate(15, 15)">
      <circle cx="50" cy="50" r="48" fill="#0C1E3C"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#D4AF37" stroke-width="2"/>
      <!-- Travel Passport Plane Orbit -->
      <path d="M25,65 C30,40 50,25 75,35" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="76,32 82,37 77,41 78,36" fill="#38BDF8"/>
      <!-- Gold Crown/Star Accent -->
      <path d="M40,55 L45,45 L50,52 L55,45 L60,55 Z" fill="#D4AF37"/>
    </g>

    <!-- Typography -->
    <g transform="translate(140, 25)">
      <text x="0" y="44" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#0C1E3C" letter-spacing="0.5">
        Australia Visa UK
      </text>
      <text x="2" y="74" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0284C7" letter-spacing="0.8">
        Immigration &amp; Travel Advisory
      </text>
      <text x="2" y="96" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">
        UNITED KINGDOM APPLICANT PORTAL
      </text>
    </g>
  </g>
</svg>
