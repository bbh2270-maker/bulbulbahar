<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(35, 30)">
    <!-- Maple Leaf & Medical Cross Emblem -->
    <g transform="translate(15, 15)">
      <circle cx="50" cy="50" r="46" fill="#F0F9FF" stroke="#0284C7" stroke-width="3"/>
      <!-- Medical Caduceus / Cross -->
      <path d="M43,26 L57,26 L57,43 L74,43 L74,57 L57,57 L57,74 L43,74 L43,57 L26,57 L26,43 L43,43 Z" fill="#0284C7"/>
      <!-- Pill capsule diagonal accent -->
      <path d="M42,38 C46,34 52,34 56,38 L62,44 C66,48 66,54 62,58 L54,66 C50,70 44,70 40,66 Z" fill="#E11D48" opacity="0.85"/>
      <circle cx="50" cy="50" r="5" fill="#ffffff"/>
    </g>

    <!-- Typography -->
    <g transform="translate(140, 25)">
      <text x="0" y="44" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
        Global <tspan fill="#0284C7">CA</tspan> Pharmacy
      </text>
      <text x="2" y="74" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#E11D48" letter-spacing="1">
        VERIFIED CANADIAN PHARMACY
      </text>
      <text x="2" y="96" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">
        STRICT YMYL &amp; E-E-A-T COMPLIANT
      </text>
    </g>
  </g>
</svg>
