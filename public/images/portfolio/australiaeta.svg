      <polygon points="60,36 62,41 67,41 63,44 65,49 60,46 55,49 57,44 53,41 58,41" fill="#ffffff" transform="scale(0.8) translate(15, -5)"/>
      <polygon points="76,68 77,72 81,72 78,74 79,78 76,75 73,78 74,74 71,72 75,72" fill="#ffffff" transform="scale(0.6) translate(40, 20)"/>
