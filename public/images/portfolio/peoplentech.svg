<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(35, 35)">
    <!-- PeopleNTech Tech Globe / Orbit Mark -->
    <g transform="translate(15, 15)">
      <circle cx="50" cy="50" r="48" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
      <!-- Red and Blue Dynamic Tech Swooshes -->
      <path d="M25,50 C25,32 40,20 60,22 C50,26 40,36 40,50 C40,64 52,74 65,74 C50,78 30,70 25,50 Z" fill="#E11D48"/>
      <path d="M75,50 C75,68 60,80 40,78 C50,74 60,64 60,50 C60,36 48,26 35,26 C50,22 70,30 75,50 Z" fill="#1E40AF"/>
      <circle cx="50" cy="50" r="10" fill="#E11D48"/>
    </g>

    <!-- Typography -->
    <g transform="translate(140, 20)">
      <text x="0" y="46" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5">
        <tspan fill="#1E3A8A">People</tspan>
        <tspan fill="#E11D48">N</tspan>
        <tspan fill="#1E3A8A">Tech</tspan>
      </text>
      <text x="2" y="76" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#475569" letter-spacing="0.5">
        Institute of Information Technology
      </text>
      <text x="2" y="98" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#E11D48" letter-spacing="2">
        CREATING PROFESSIONALS GLOBALLY
      </text>
