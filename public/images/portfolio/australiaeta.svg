      <circle cx="60" cy="60" r="56" fill="#002147"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#FFB300" stroke-width="2.5" stroke-dasharray="6,4"/>
      
      <!-- Stylized Kangaroo / Boomerang in Gold -->
