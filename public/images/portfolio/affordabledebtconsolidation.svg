<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(20, 25)">
    <!-- Icon: Hands supporting dollar bill within circular emblem -->
    <g transform="translate(15, 10)">
      <!-- Outer circle ring -->
      <circle cx="65" cy="65" r="58" fill="none" stroke="#009688" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Dollar banknote in center -->
      <rect x="35" y="42" width="60" height="34" rx="4" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
      <circle cx="65" cy="59" r="10" fill="#4CAF50"/>
      <text x="65" y="65" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
      <circle cx="42" cy="59" r="3" fill="#A5D6A7"/>
      <circle cx="88" cy="59" r="3" fill="#A5D6A7"/>
      
      <!-- Cupped supporting hands -->
      <path d="M22,85 C32,105 50,118 65,118 C80,118 98,105 108,85 C95,95 80,102 65,102 C50,102 35,95 22,85 Z" fill="#00838F"/>
      <path d="M18,72 C16,84 22,96 32,104 C24,96 18,85 18,72 Z" fill="#006064"/>
      <path d="M112,72 C114,84 108,96 98,104 C106,96 112,85 112,72 Z" fill="#006064"/>
    </g>

    <!-- Typography -->
    <g transform="translate(160, 20)">
      <text x="0" y="52" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#2E7D32" letter-spacing="-0.5">
        Affordable
      </text>
      <text x="0" y="96" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#00838F" letter-spacing="-0.2">
        Debt Consolidation
      </text>
      <text x="2" y="118" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#78909C" letter-spacing="1.5">
        FINANCIAL RELIEF &amp; ADVISORY
      </text>
    </g>
  </g>
</svg>
