<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <!-- Clean Light Slate/White Card Background with soft depth -->
  <rect width="100%" height="100%" fill="#1E293B" rx="16"/>
  <g transform="translate(250, 42)" text-anchor="middle">
    <!-- Circular Unity Figures Emblem -->
    <g transform="translate(0, 5)">
      <!-- 4 stylized figures holding hands in a circular ring -->
      <!-- Top Figure (Cyan) -->
      <circle cx="0" cy="-22" r="5" fill="#38BDF8"/>
      <path d="M-10,-12 C-10,-18 10,-18 10,-12 C8,-8 2,-7 0,-7 C-2,-7 -8,-8 -10,-12 Z" fill="#38BDF8"/>

      <!-- Right Figure (Lime) -->
      <circle cx="22" cy="0" r="5" fill="#A3E635"/>
      <path d="M12,-10 C18,-10 18,10 12,10 C8,8 7,2 7,0 C7,-2 8,-8 12,-10 Z" fill="#A3E635"/>

      <!-- Bottom Figure (Yellow/Gold) -->
      <circle cx="0" cy="22" r="5" fill="#FACC15"/>
      <path d="M-10,12 C-10,18 10,18 10,12 C8,8 2,7 0,7 C-2,7 -8,8 -10,12 Z" fill="#FACC15"/>

      <!-- Left Figure (Coral/Red) -->
      <circle cx="-22" cy="0" r="5" fill="#F87171"/>
      <path d="M-12,-10 C-18,-10 -18,10 -12,10 C-8,8 -7,2 -7,0 C-7,-2 -8,-8 -12,-10 Z" fill="#F87171"/>
    </g>

    <!-- Typography -->
    <text x="0" y="78" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" letter-spacing="1">
      AMAR Home
    </text>
    <text x="0" y="104" font-family="'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="1">
      Committed to Freedom
    </text>
  </g>
</svg>
